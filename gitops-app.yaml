apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coolstore-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: http://theplayground.home:3000/yass/tektoSync-Config.git
    targetRevision: HEAD 
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
