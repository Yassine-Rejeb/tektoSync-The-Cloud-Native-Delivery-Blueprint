apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: payment-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MY_CLUSTER_KAFKA_BOOTSTRAP_SERVICE_HOST
              value: "kafka"
            - name: COOLSTORE_GW_ENDPOINT
              value: payment
